{% extends "layout.html" %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="/">main</a></li>
    <li class="breadcrumb-item active">{{ bot.name }}</li>
  </ol>
</nav>

<div class="row">
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">Technical Parameters</div>
            <div class="card-body">
                <form id="updateForm">
                    <div class="mb-3">
                        <label class="form-label font-monospace small text-muted">Git URL</label>
                        <input type="text" class="form-control form-control-sm" name="url" value="{{ bot.url }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label font-monospace small text-muted">Git branch</label>
                        <input type="text" class="form-control form-control-sm" name="branch" value="{{ bot.branch }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-monospace small text-muted">Telegram Token</label>
                        <input type="text" class="form-control form-control-sm" name="token" value="{{ bot.token }}">
                    </div>

                    <div class="row mb-2">
                        <div class="col">
                            <label class="form-label small">RAM reservation (MB)</label>
                            <input type="number" class="form-control" name="mem_reservation" value="{{ bot.mem_reservation }}">
                        </div>
                        <div class="col">
                            <label class="form-label small">RAM Limit (MB)</label>
                            <input type="number" class="form-control" name="mem_limit" value="{{ bot.mem_limit }}">
                        </div>
                    </div>
                    <div class="row mb-2">
                        <div class="col">
                            <label class="form-label small">CPU Quota (%)</label>
                            <input type="number" class="form-control" name="cpu_quota" value="{{ bot.cpu_quota_percents }}">
                        </div>
                        <div class="col">
                            <label class="form-label small">CPU period (%)</label>
                            <input type="number" class="form-control" name="cpu_period" value="{{ bot.cpu_period_percents }}">
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <label class="form-label small">Restart Policy</label>
                        <select class="form-select" name="restart_policy">
                            {% for policy in ['no', 'always', 'on-failure', 'unless-stopped'] %}
                            <option value="{{ policy }}" {% if bot.restart_policy.value == policy %}selected{% endif %}>{{ policy }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="need_db" id="need_db" {% if bot.need_db %}checked{% endif %}>
                        <label class="form-check-label" for="need_db"><b>Need database</b></label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if bot.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active"><b>Bot Active (Allowed to run)</b></label>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="button" onclick="saveBot()" class="btn btn-primary flex-grow-1">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                        <button type="button" onclick="gitUpdate('{{ bot.id }}')" class="btn btn-outline-dark">
                            <i class="bi bi-git"></i> Git Update
                        </button>
                        <button type="button" onclick="deleteBot('{{ bot.id }}', '{{ bot.name }}')" class="btn btn-danger ms-auto">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Extra ENV</span>
                <button class="btn btn-sm btn-outline-primary" onclick="addEnvRow()">+</button>
            </div>
            <div class="card-body">
                <div id="env-list">
                    {% for key, val in bot.extra_env.items() %}
                    <div class="input-group mb-2 env-row">
                        <input type="text" class="form-control form-control-sm env-key" value="{{ key }}">
                        <input type="text" class="form-control form-control-sm env-value" value="{{ val }}">
                        <button class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()">×</button>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card bg-dark text-light">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-terminal"></i> Container Logs</span>
                <button class="btn btn-sm btn-outline-light" onclick="refreshLogs('{{ bot.id }}')">Refresh</button>
            </div>
            <div class="card-body p-0">
                <pre id="log-viewer" class="p-3 mb-0" style="height: 300px; overflow-y: auto; font-size: 0.85rem; color: #00ff00;"></pre>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function addEnvRow() {
    const row = document.createElement('div');
    row.className = 'input-group mb-2 env-row';
    row.innerHTML = `
        <input type="text" class="form-control form-control-sm env-key" placeholder="KEY">
        <input type="text" class="form-control form-control-sm env-value" placeholder="VALUE">
        <button class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()">×</button>
    `;
    document.getElementById('env-list').appendChild(row);
}

async function saveBot() {
    const form = document.getElementById('updateForm');
    const formData = new FormData(form);
    
    const extra_env = {};
    document.querySelectorAll('.env-row').forEach(row => {
        const k = row.querySelector('.env-key').value.trim();
        const v = row.querySelector('.env-value').value.trim();
        if (k) extra_env[k] = v;
    });

    const data = Object.fromEntries(formData.entries());
    data.extra_env = extra_env;

    const response = await fetch('/{{ bot.id }}', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    const result = await response.json();
    alert(result.message);
}

async function gitUpdate(botId) {
    if (!confirm('Pull latest code and restart container?')) return;
    const res = await fetch(`/${botId}/git-update`, { method: 'POST' });
    const data = await res.json();
    alert(data.message);
}

async function deleteBot(botId, botName) {
    const firstConfirm = confirm(`Are you sure you want to delete bot "${botName}"?`);
    if (!firstConfirm) return;
    const secondConfirm = confirm('WARNING: This will stop the container, remove all bot files and database records. This action CANNOT be undone. Proceed?');
    if (!secondConfirm) return;

    try {
        const response = await fetch(`/bots/${botId}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();
        if (response.status == 'success') {
            alert(result.message || 'Bot deleted successfully');
            window.location.href = '/';
        } else {
            alert('Error: ' + (result.message || 'Failed to delete bot'));
        }
    } catch (error) {
        console.error('Delete error:', error);
        alert('Critical error during deletion');
    }
}

async function refreshLogs(botId) {
    const viewer = document.getElementById('log-viewer');
    viewer.innerText = 'Loading...';
    const res = await fetch(`/${botId}/logs`);
    const data = await res.json();
    viewer.innerText = data.logs || 'No logs available.';
    viewer.scrollTop = viewer.scrollHeight;
}

if (document.getElementById('log-viewer')) {
    refreshLogs('{{ bot.id }}');
}
</script>
{% endblock %}
